<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歸蚓酷客 Green coo coo | AI 蚯蚓堆肥智慧助教</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 antialiased">

  <div class="flex flex-col h-screen max-w-md mx-auto bg-stone-50 border-x border-stone-200 shadow-lg">
    <!-- 頂部品牌列 -->
    <header class="bg-emerald-800 text-white p-4 shadow-md flex items-center gap-3 shrink-0">
      <div class="w-10 h-10 rounded-full bg-amber-400 text-emerald-950 flex items-center justify-center font-bold text-lg shadow-inner">
        蚓
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-wide">歸蚓酷客 Green coo coo</h1>
        <p class="text-xs text-emerald-200">自主學習型・蚯蚓堆肥智慧助教</p>
      </div>
    </header>

    <!-- 對話訊息區 -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="flex justify-start">
        <div class="max-w-[85%] rounded-2xl rounded-bl-none px-4 py-3 text-sm whitespace-pre-wrap leading-relaxed bg-white text-stone-800 border border-stone-200 shadow-sm">哈囉！我是「歸蚓酷客」的虛擬助教酷客 🌱
蚯蚓是土壤生態系的好夥伴，今天你的蚯蚓箱還好嗎？有任何觀察或疑問，隨時問我喔！</div>
      </div>
    </main>

    <!-- 快速提問標籤 -->
    <div class="px-4 py-2 flex gap-2 overflow-x-auto bg-stone-100 border-t border-stone-200 shrink-0">
      <button onclick="quickAsk('箱子有臭味怎麼辦？')" class="shrink-0 text-xs bg-white border border-emerald-700 text-emerald-800 px-3 py-1.5 rounded-full hover:bg-emerald-50">箱子有臭味</button>
      <button onclick="quickAsk('出現很多小果蠅怎麼辦？')" class="shrink-0 text-xs bg-white border border-emerald-700 text-emerald-800 px-3 py-1.5 rounded-full hover:bg-emerald-50">出現小果蠅</button>
      <button onclick="quickAsk('蚯蚓一直想逃家？')" class="shrink-0 text-xs bg-white border border-emerald-700 text-emerald-800 px-3 py-1.5 rounded-full hover:bg-emerald-50">蚯蚓想逃家</button>
      <button onclick="quickAsk('蚯蚓糞什麼時候可採收？')" class="shrink-0 text-xs bg-white border border-emerald-700 text-emerald-800 px-3 py-1.5 rounded-full hover:bg-emerald-50">什麼時候可採收</button>
    </div>

    <!-- 底部輸入框 -->
    <form id="chatForm" class="p-3 bg-white border-t border-stone-200 flex gap-2 shrink-0">
      <input
        type="text"
        id="userInput"
        placeholder="描述你看到的蚯蚓箱狀況..."
        class="flex-1 border border-stone-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-emerald-700"
        required
      />
      <button
        type="submit"
        id="sendBtn"
        class="bg-emerald-700 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-emerald-800 disabled:opacity-50 transition"
      >
        發問
      </button>
    </form>
  </div>

  <script>
    // ⚠️ 請將下方的雙引號內換成你的 Google Apps Script 網頁應用程式網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwq3-aXApahvHyFsnFxm7_V6WQFXmac68NtWe_sAPt89wtuUgzTdiG3LawWcdJJySpLDA/exec";

    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      if (q) userInput.value = q;
    });

    function quickAsk(text) {
      userInput.value = text;
      userInput.focus();
    }

    // 觸發自主學習回饋
    async function sendFeedback(btnElement, kbId, originalQuestion) {
      btnElement.disabled = true;
      btnElement.textContent = '✨ 已幫酷客記住這個問法！';
      btnElement.className = 'text-xs text-emerald-700 font-medium mt-2 block';

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'feedback',
            kbId: kbId,
            question: originalQuestion
          })
        });
      } catch (e) {
        console.error('回饋寫入失敗', e);
      }
    }

    function appendMessage(role, text, meta = {}) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${role === 'user' ? 'items-end' : 'items-start'}`;
      
      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'max-w-[85%] rounded-2xl rounded-br-none px-4 py-3 text-sm whitespace-pre-wrap leading-relaxed bg-emerald-700 text-white'
        : 'max-w-[85%] rounded-2xl rounded-bl-none px-4 py-3 text-sm whitespace-pre-wrap leading-relaxed bg-white text-stone-800 border border-stone-200 shadow-sm';
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      // 若成功命中知識庫，顯示「自主學習按鈕」
      if (role === 'assistant' && meta.kbId) {
        const feedbackBtn = document.createElement('button');
        feedbackBtn.textContent = '👍 這個解答有幫到我（讓酷客更聰明）';
        feedbackBtn.className = 'mt-1.5 ml-1 text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-full hover:bg-emerald-100 transition';
        feedbackBtn.onclick = () => sendFeedback(feedbackBtn, meta.kbId, meta.originalQuestion);
        wrapper.appendChild(feedbackBtn);
      }

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      sendBtn.disabled = true;

      const loadingId = 'loading-' + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.id = loadingId;
      loadingDiv.className = 'text-xs text-stone-500 animate-pulse pl-2';
      loadingDiv.textContent = '酷客正在比對生態筆記中...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'ask', message: text, source: 'Web_QRCode' })
        });
        const data = await res.json();
        document.getElementById(loadingId)?.remove();
        appendMessage('assistant', data.reply, { kbId: data.kbId, originalQuestion: text });
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        appendMessage('assistant', '哎呀，網路連線有點不穩，請確認 GAS 網址是否正確設定並再試一次！');
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
