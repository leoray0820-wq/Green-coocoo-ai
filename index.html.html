<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歸蚓酷客 Green coo coo | 生態觀察資料庫學習單</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 antialiased">

  <div class="min-h-screen max-w-md mx-auto bg-stone-50 border-x border-stone-200 shadow-lg flex flex-col">
    <!-- 頂部品牌列 -->
    <header class="bg-emerald-800 text-white p-4 shadow-md">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-400 text-emerald-950 flex items-center justify-center font-bold text-lg shrink-0">
          蚓
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-wide">歸蚓酷客 Green coo coo</h1>
          <p class="text-xs text-emerald-200">蚯蚓生態急救資料庫 × 觀察學習單</p>
        </div>
      </div>

      <!-- 分頁切換按鈕 -->
      <div class="grid grid-cols-2 gap-2 mt-4 bg-emerald-900/60 p-1 rounded-xl">
        <button id="tab-db" onclick="switchTab('db')" class="py-2 text-sm font-bold rounded-lg bg-white text-emerald-900 shadow transition">
          📖 生態急救資料庫
        </button>
        <button id="tab-form" onclick="switchTab('form')" class="py-2 text-sm font-bold rounded-lg text-emerald-100 hover:bg-emerald-800/60 transition">
          ✍️ 填寫觀察學習單
        </button>
      </div>
    </header>

    <!-- ========================================== -->
    <!-- 分頁一：生態急救資料庫（即時同步試算表） -->
    <!-- ========================================== -->
    <main id="view-db" class="flex-1 p-4 space-y-4">
      <!-- 搜尋框 -->
      <input
        type="text"
        id="searchInput"
        oninput="filterCards()"
        placeholder="🔍 搜尋問題關鍵字（例如：臭味、果蠅、逃家）..."
        class="w-full bg-white border border-stone-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-700 shadow-sm"
      />

      <!-- 分類篩選按鈕列 -->
      <div id="categoryBar" class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="selectCategory('全部')" class="cat-btn active shrink-0 text-xs px-3 py-1.5 rounded-full bg-emerald-700 text-white font-medium">全部</button>
      </div>

      <!-- 資料庫卡片列表 -->
      <div id="kbContainer" class="space-y-3">
        <div class="text-center py-10 text-sm text-stone-500 animate-pulse">正在從酷客雲端載入最新生態資料庫...</div>
      </div>
    </main>

    <!-- ========================================== -->
    <!-- 分頁二：五感觀察學習單（回傳試算表＋轉傳LINE） -->
    <!-- ========================================== -->
    <main id="view-form" class="hidden flex-1 p-4 space-y-4">
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 leading-relaxed">
        🌱 <strong>蚯蚓是土壤生態系的一員</strong>：透過「聞氣味、摸濕度、看生物」三步驟，記錄你今天的箱子狀態，系統會自動存入老師的觀察紀錄表！
      </div>

      <form id="worksheetForm" class="space-y-4 bg-white p-4 rounded-2xl border border-stone-200 shadow-sm">
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">1. 你的名字 / 暱稱（或蚯蚓箱編號）</label>
          <input type="text" id="studentName" required placeholder="例如：王小明 / 陽台1號箱" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">2. 嗅覺觀察：打開蓋子聞到什麼味道？</label>
          <select id="smell" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="清新泥土與森林落葉味（健康）">🌿 清新泥土與森林落葉味（健康）</option>
            <option value="微酸發酵果香味（廚餘略多）">🍎 微酸發酵果香味（廚餘略多）</option>
            <option value="刺鼻阿摩尼亞或臭水溝味（厭氧缺氧）">⚠️ 刺鼻阿摩尼亞或臭水溝味（厭氧缺氧）</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">3. 觸覺觀察：抓一把底層墊料捏起來的感覺？</label>
          <select id="moisture" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="像擰乾的毛巾（濕度 70% 最理想）">💧 像擰乾的毛巾（濕度 70% 最理想）</option>
            <option value="偏乾鬆散、像乾落葉（需補水）">🍂 偏乾鬆散、像乾落葉（需補水）</option>
            <option value="指縫會滴水、泥濘軟爛（過濕需加乾紙板）">💦 指縫會滴水、泥濘軟爛（過濕需加乾紙板）</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">4. 生態觀察：箱子裡看到哪些小訪客？</label>
          <input type="text" id="critters" placeholder="例如：跳蟲、小果蠅、白線蚓、很多蚯蚓寶寶" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">5. 今天想問老師的問題或觀察心得</label>
          <textarea id="notes" rows="3" placeholder="寫下你最近的投餵內容，或遇到的特殊狀況..." class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm hover:bg-emerald-800 transition shadow">
          📤 送出學習單並存入雲端紀錄
        </button>
      </form>

      <!-- 送出成功後的 LINE 一鍵分享區 -->
      <div id="shareBox" class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center space-y-3">
        <p class="text-sm font-bold text-emerald-900">✅ 觀察學習單已成功存入老師的資料庫！</p>
        <p class="text-xs text-emerald-700">需要老師在群組幫你即時看診嗎？點擊下方按鈕可直接把這份報告貼到 LINE 群組：</p>
        <a id="lineShareLink" href="#" target="_blank" class="inline-block w-full bg-[#06C755] text-white font-bold py-2.5 rounded-xl text-sm shadow hover:opacity-90">
          💬 一鍵轉傳觀察報告到 LINE 群組
        </a>
      </div>
    </main>
  </div>

  <script>
    // ⚠️ 請貼上你的 Google Apps Script 網頁應用程式網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz104mTi60sQvpS2nZETc4pPdGNDZ6jzJMDJ6xItv2Lb5tVz3kcT2HyNd1eXgtnBFn5gw/exec";

    let allKnowledge = [];
    let currentCategory = "全部";

    // 頁面載入時自動向試算表抓取最新資料
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        allKnowledge = await res.json();
        renderCategories();
        renderCards(allKnowledge);
      } catch (e) {
        document.getElementById('kbContainer').innerHTML =
          '<div class="text-center py-8 text-sm text-red-600">無法載入資料庫，請確認 GAS 網址與權限是否設為「所有人」。</div>';
      }
    });

    function switchTab(tab) {
      const isDb = tab === 'db';
      document.getElementById('view-db').classList.toggle('hidden', !isDb);
      document.getElementById('view-form').classList.toggle('hidden', isDb);
      
      document.getElementById('tab-db').className = isDb
        ? 'py-2 text-sm font-bold rounded-lg bg-white text-emerald-900 shadow transition'
        : 'py-2 text-sm font-bold rounded-lg text-emerald-100 hover:bg-emerald-800/60 transition';
      document.getElementById('tab-form').className = !isDb
        ? 'py-2 text-sm font-bold rounded-lg bg-white text-emerald-900 shadow transition'
        : 'py-2 text-sm font-bold rounded-lg text-emerald-100 hover:bg-emerald-800/60 transition';
    }

    function renderCategories() {
      const cats = ['全部', ...new Set(allKnowledge.map(item => item.category))];
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = cats.map(c => `
        <button onclick="selectCategory('${c}')" class="shrink-0 text-xs px-3.5 py-1.5 rounded-full border transition ${
          c === currentCategory ? 'bg-emerald-700 text-white border-emerald-700 font-bold' : 'bg-white text-stone-700 border-stone-300'
        }">${c}</button>
      `).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      filterCards();
    }

    function filterCards() {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allKnowledge.filter(item => {
        const matchCat = currentCategory === '全部' || item.category === currentCategory;
        const matchKw = !kw || item.title.toLowerCase().includes(kw) || item.answer.toLowerCase().includes(kw);
        return matchCat && matchKw;
      });
      renderCards(filtered);
    }

    function renderCards(list) {
      const container = document.getElementById('kbContainer');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-sm text-stone-500">找不到符合的紀錄，歡迎切換到「✍️ 填寫觀察學習單」向老師提問！</div>';
        return;
      }

      container.innerHTML = list.map((item, idx) => `
        <details class="group bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden" ${idx === 0 ? 'open' : ''}>
          <summary class="list-none p-4 cursor-pointer flex items-start justify-between gap-2 font-bold text-stone-800 text-sm hover:bg-stone-50">
            <div>
              <span class="inline-block text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md mr-1.5">${item.category}</span>
              <span>${item.title}</span>
            </div>
            <span class="text-emerald-700 text-xs shrink-0 mt-0.5">展開 ▾</span>
          </summary>
          <div class="px-4 pb-4 pt-2 border-t border-stone-100 text-sm text-stone-700 space-y-3 leading-relaxed whitespace-pre-wrap">
            <div>${item.answer}</div>
            ${item.followUp ? `
              <div class="bg-amber-50/80 border border-amber-200/80 rounded-xl p-3 text-xs text-amber-950">
                <strong>🔍 酷客觀察小任務：</strong><br>${item.followUp}
              </div>
            ` : ''}
          </div>
        </details>
      `).join('');
    }

    // 處理學習單送出
    document.getElementById('worksheetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 正在寫入雲端學習單...';

      const payload = {
        studentName: document.getElementById('studentName').value,
        smell: document.getElementById('smell').value,
        moisture: document.getElementById('moisture').value,
        critters: document.getElementById('critters').value || '無特別發現',
        notes: document.getElementById('notes').value || '無'
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        // 組合一鍵轉傳 LINE 的格式化訊息
        const shareText = `🌱【歸蚓酷客・生態觀察學習單】\n👤 學員：${payload.studentName}\n👃 氣味：${payload.smell}\n💧 濕度：${payload.moisture}\n🐛 訪客：${payload.critters}\n📝 紀錄/提問：${payload.notes}`;
        document.getElementById('lineShareLink').href = `https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`;
        
        document.getElementById('shareBox').classList.remove('hidden');
        btn.textContent = '✅ 已成功送出！';
      } catch (err) {
        alert('送出時發生網路錯誤，請稍後再試！');
        btn.disabled = false;
        btn.textContent = '📤 送出學習單並存入雲端紀錄';
      }
    });
  </script>
</body>
</html>
